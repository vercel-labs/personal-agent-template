packages:
  - "."

minimumReleaseAgeExclude:
  - eve
  - "@vercel/connect"
  - "@github-tools/eve-extension"
  - "@github-tools/sdk"
  - '@vercel/cli-config@0.3.8'
  - '@vercel/oidc@4.0.8'
  - '@comark/nuxt@0.9.1'
  - '@comark/vue@0.9.1'
  - comark@0.9.1

# pnpm 10+ requires each build script to be allowed explicitly.
allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  sharp: false
